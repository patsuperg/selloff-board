    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey('raw',enc.encode(key),'PBKDF2',false,['deriveKey']);

      {name:'PBKDF2',salt:Uint8Array.from(atob(PAYLOAD.salt),c=>c.charCodeAt(0)),
       iterations:PAYLOAD.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt(
      {name:'AES-GCM',iv:Uint8Array.from(atob(PAYLOAD.iv),c=>c.charCodeAt(0))},
      k,Uint8Array.from(atob(PAYLOAD.ct),c=>c.charCodeAt(0)));
